        <!-- Product Grid -->

            <!-- Products dynamic display yahan honge -->

            const theme = categoryThemes[category.toLowerCase()] || categoryThemes.electronics;

                <rect width="300" height="200" fill="${theme.bg}"/>
                <circle cx="150" cy="70" r="30" fill="${theme.circle}"/>
                <text x="150" y="78" fill="${theme.iconColor}" font-family="Segoe UI, sans-serif" font-size="24" text-anchor="middle">${theme.icon}</text>
                <text x="150" y="125" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">${title}</text>
                <rect x="100" y="140" width="100" height="20" rx="10" fill="${theme.badgeBg}"/>
                <text x="150" y="154" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">${category.toUpperCase()}</text>
            </svg>`;
            return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
        }

            { id: 60, name: "Mixed Berry Granola Cereal", category: "groceries", price: 7.25, image: createCategorySvg("Mixed Berry Granola Cereal", "groceries") }

        let allProducts = [];

        document.addEventListener("DOMContentLoaded", () => {
            loadProducts();
            updateCartCount();
        });

        function loadProducts() {
            let customProducts = JSON.parse(localStorage.getItem('customProducts')) || [];
            allProducts = [...defaultProducts, ...customProducts];
            displayProducts(allProducts);
        }

        function displayProducts(productsToRender) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (productsToRender.length === 0) {
                grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: #64748b; font-size: 18px;">No products found.</p>';
                return;
            }

            productsToRender.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div style="text-align: center; margin-bottom: 15px; border-radius: 8px; overflow: hidden; height: 160px; display: flex; align-items: center; justify-content: center;">
                        <img src="${product.image}" alt="${product.name}" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div>
                        <h4 style="font-size: 16px; font-weight: 600; color: #0f172a; margin-bottom: 5px;">${product.name}</h4>
                        <p style="font-size: 12px; text-transform: uppercase; color: #64748b; font-weight: 600; margin-bottom: 10px;">${product.category}</p>
                        <p style="font-size: 18px; font-weight: 700; color: #16a34a; margin-bottom: 15px;">$${parseFloat(product.price).toFixed(2)}</p>
                    </div>
                    <button onclick="addToCart(${product.id}, this)" style="background-color: #2563eb; color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: 600; cursor: pointer; transition: background 0.2s;">Add to Cart</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (category === 'all') {
                displayProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category.toLowerCase() === category.toLowerCase());
                displayProducts(filtered);
            }
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
            displayProducts(filtered);
        }

        function addToCart(productId, btn) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const product = allProducts.find(p => p.id === productId);

            if (product) {
                cart.push(product);
                localStorage.setItem('cart', JSON.stringify(cart));

                btn.innerText = "Added! ✓";
                btn.style.backgroundColor = "#16a34a";

                setTimeout(() => {
                    btn.innerText = "Add to Cart";
                    btn.style.backgroundColor = "#2563eb";
                }, 1200);

                updateCartCount();
            }
        }

        function updateCartCount() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const badge = document.getElementById('cart-count');
            if (badge) {
                badge.innerText = cart.length;
            }
        }
    </script>
</body>
</html>
