<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniStore - Explore Products</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>

    <!-- Header / Navigation Bar -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">🛍️ OmniStore</a>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="Search products...">
        </div>
        <nav class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="admin.html">Admin Panel</a>
            <a href="cart.html" class="cart-btn">🛒 Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <!-- Main Container -->
    <main class="container">
        <h2>Explore Products</h2>

        <!-- Category Filters -->
        <div class="category-buttons">
            <button class="filter-btn active" onclick="filterCategory('all')">All</button>
            <button class="filter-btn" onclick="filterCategory('electronics')">Electronics</button>
            <button class="filter-btn" onclick="filterCategory('watches')">Watches</button>
            <button class="filter-btn" onclick="filterCategory('skincare')">Skincare</button>
            <button class="filter-btn" onclick="filterCategory('haircare')">Hair Care</button>
            <button class="filter-btn" onclick="filterCategory('fashion')">Fashion</button>
            <button class="filter-btn" onclick="filterCategory('groceries')">Groceries</button>
        </div>

        <!-- Products Grid Container -->
        <div class="product-grid" id="productGrid">
            <!-- Product items will be loaded or rendered here -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 OmniStore. All Rights Reserved.</p>
    </footer>

    <!-- Updated JavaScript with English Green Button State Feedback -->
    <script>
        // Synchronize Cart Count on Page Load
        document.addEventListener("DOMContentLoaded", () => {
            updateCartCount();
        });

        // Add to Cart Function with Green Button Feedback (No Alerts)
        function addToCart(button, productName, price) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push({ name: productName, price: parseFloat(price) });
            localStorage.setItem('cart', JSON.stringify(cart));

            // Update badge count
            updateCartCount();

            // Store original button styling
            const originalText = button.innerText;
            const originalBg = button.style.backgroundColor;

            // Apply Green "Added!" state
            button.innerText = "Added! ✓";
            button.style.backgroundColor = "#28a745";
            button.style.color = "#ffffff";
            button.disabled = true;

            // Revert back after 1.5 seconds
            setTimeout(() => {
                button.innerText = originalText;
                button.style.backgroundColor = originalBg;
                button.style.color = "";
                button.disabled = false;
            }, 1500);
        }

        // Cart Count Helper Function
        function updateCartCount() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartBadge = document.getElementById('cart-count');
            if (cartBadge) {
                cartBadge.innerText = cart.length;
            }
        }

        // Live Product Search
        function searchProducts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('product-card');

            Array.from(cards).forEach(card => {
                let title = card.querySelector('h3').innerText.toLowerCase();
                if (title.includes(input)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }

        // Category Filter
        function filterCategory(category) {
            let cards = document.getElementsByClassName('product-card');
            let buttons = document.getElementsByClassName('filter-btn');

            Array.from(buttons).forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            Array.from(cards).forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
