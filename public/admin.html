<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniStore Admin</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>

    <!-- Header / Navigation Bar -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">🛍️ OmniStore Admin</a>
        </div>
        <nav class="nav-links">
            <a href="index.html">Store Front</a>
            <a href="admin.html" class="active">Admin Panel</a>
        </nav>
    </header>

    <!-- Main Admin Container -->
    <main class="container">
        <div class="form-card" style="background: #ffffff; padding: 30px; border-radius: 12px; max-width: 800px; margin: 30px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
            <h2>➕ Add New Product</h2>
            <form id="addProductForm">
                <div style="display: flex; gap: 20px; margin-bottom: 15px;">
                    <div style="flex: 1;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Product Name</label>
                        <input type="text" id="productName" placeholder="e.g. Rolex watch" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Category</label>
                        <select id="productCategory" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
                            <option value="electronics">Electronics</option>
                            <option value="watches" selected>Watches</option>
                            <option value="skincare">Skincare</option>
                            <option value="haircare">Hair Care</option>
                            <option value="fashion">Fashion</option>
                            <option value="groceries">Groceries</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 20px; margin-bottom: 15px;">
                    <div style="flex: 1;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Price ($)</label>
                        <input type="number" id="productPrice" step="0.01" placeholder="400.00" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Stock Quantity</label>
                        <input type="number" id="productStock" placeholder="1" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Product Image (Browse File OR Enter URL)</label>
                    <div style="display: flex; gap: 15px; align-items: center;">
                        <input type="file" id="productFileInput" accept="image/*" style="flex: 1;">
                        <span>OR</span>
                        <input type="text" id="productUrlInput" placeholder="https://example.com/image.jpg" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
                    </div>
                    <div style="margin-top: 15px;">
                        <img id="imagePreview" src="" alt="Preview" style="max-width: 120px; display: none; border-radius: 6px;">
                    </div>
                </div>

                <button type="submit" id="submitBtn" style="background-color: #0d6efd; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;">Add Product to Store</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 OmniStore. All Rights Reserved.</p>
    </footer>

    <script>
        const fileInput = document.getElementById('productFileInput');
        const urlInput = document.getElementById('productUrlInput');
        const preview = document.getElementById('imagePreview');
        let selectedImageData = '';

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    selectedImageData = event.target.result;
                    preview.src = selectedImageData;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
                urlInput.value = '';
            }
        });

        urlInput.addEventListener('input', function() {
            if (urlInput.value.trim() !== '') {
                selectedImageData = urlInput.value.trim();
                preview.src = selectedImageData;
                preview.style.display = 'block';
                fileInput.value = '';
            } else {
                preview.style.display = 'none';
            }
        });

        document.getElementById('addProductForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('productName').value.trim();
            const category = document.getElementById('productCategory').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const stock = parseInt(document.getElementById('productStock').value);
            const image = selectedImageData || urlInput.value.trim() || 'https://via.placeholder.com/150';

            const newProduct = {
                id: Date.now(),
                name: name,
                category: category,
                price: price,
                stock: stock,
                image: image
            };

            let customProducts = JSON.parse(localStorage.getItem('customProducts')) || [];
            customProducts.push(newProduct);

            try {
                localStorage.setItem('customProducts', JSON.stringify(customProducts));

                const btn = document.getElementById('submitBtn');
                btn.innerText = "Added Successfully! ✓";
                btn.style.backgroundColor = "#28a745";

                setTimeout(() => {
                    btn.innerText = "Add Product to Store";
                    btn.style.backgroundColor = "#0d6efd";
                    document.getElementById('addProductForm').reset();
                    preview.style.display = 'none';
                    selectedImageData = '';
                }, 1500);

            } catch (err) {
                alert("Error: Image size is too large for local storage. Please try using an Image URL or a smaller image file.");
            }
        });
    </script>
</body>
</html>
